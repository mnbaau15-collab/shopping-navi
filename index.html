  <!-- 画面の上の部分（アプリの名前）。表紙のときは、画像の中に同じ文字があるので、見えなくする（読み上げ用には残す） -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="app-title"><span class="title-sub">かんたん</span><br>お買い物<br>ナビ</h1>
      <!-- どの画面からでも、すぐ表紙にもどれるボタン（表紙のときは、頭の部分ごと見えない） -->
      <button type="button" class="header-home-button" id="back-to-top-from-header">
        <span aria-hidden="true">⬅</span> 最初の 画面に もどる
      </button>
      <p class="app-lead">近くのお店を、<br>かんたんに さがせます。</p>
    </div>
  </header>

  <!-- 表紙の画像（表紙のときだけ出ます）。Canva で作った表紙で、タイトルと説明文が、画像の中に入っています -->
  <div class="hero">
    <img src="images/cover.jpg?v=20261102a" width="1024" height="796"
         alt="かんたん お買い物ナビ。近くのスーパーや、チラシを、かんたんに探せます。スーパーの前で、笑顔の家族が、買い物に来ています。">
  </div>

  <main class="top-main">

    <!-- ========== 画面1：表紙（さがし方をえらぶ） ========== -->
    <section id="screen-top">

    <h2 class="visually-hidden" id="top-title" tabindex="-1">どうやって さがしますか？</h2>

    <!-- 3つの探し方のボタン（表紙の絵の、カードの形） -->
    <div class="search-cards">
      <button type="button" class="search-card search-card-green" id="button-location">
        <span class="search-card-icon" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-here"/></svg></span>
        <span class="search-card-text">
          <span class="search-card-title">現在地から さがす</span>
        </span>
        <span class="search-card-arrow" aria-hidden="true">›</span>
      </button>

      <button type="button" class="search-card search-card-orange" id="button-city">
        <span class="search-card-icon" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-town"/></svg></span>
        <span class="search-card-text">
          <span class="search-card-title">市や町から さがす</span>
        </span>
        <span class="search-card-arrow" aria-hidden="true">›</span>
      </button>

      <button type="button" class="search-card search-card-blue" id="button-name">
        <span class="search-card-icon" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-name"/></svg></span>
        <span class="search-card-text">
          <span class="search-card-title">お店の 名前で さがす</span>
        </span>
        <span class="search-card-arrow" aria-hidden="true">›</span>
      </button>
    </div>

    </section>

    <!-- ========== 画面2：市や町をえらぶ ========== -->
    <!-- hidden がついている間は、画面に出ません -->
    <section id="screen-city" hidden>
      <h2 class="section-title" id="city-title" tabindex="-1">どの市・町ですか？</h2>

      <!-- 市や町のボタンは、app.js が店舗データから作ります -->
      <div class="search-buttons" id="city-buttons"></div>

      <div class="nav-buttons">
        <button type="button" class="big-button sub-button" id="back-to-top-from-city">
          <span class="button-icon" aria-hidden="true">⬅</span>
          <span class="button-label">最初の 画面に もどる</span>
        </button>
      </div>
    </section>

    <!-- ========== 画面：いまいる場所からさがす ========== -->
    <section id="screen-location" hidden>
      <h2 class="section-title" id="location-title" tabindex="-1">現在地から さがす</h2>

      <!-- 現在地を使う前に、目的を説明する -->
      <p class="location-explain">
        現在地を 使って 近いお店を さがします。<br>
        現在地は 保存も 送信も しません。
      </p>

      <button type="button" class="big-button" id="button-use-location">
        <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-here"/></svg></span>
        <span class="button-label">現在地から さがす</span>
      </button>

      <!-- 「しらべています…」「見つかりました」などの知らせ -->
      <p id="location-message" class="search-message" role="status" aria-live="polite"></p>

      <!-- うまくいかなかったときだけ出す、ほかのさがし方のボタン -->
      <div class="nav-buttons" id="location-other-way" hidden>
        <button type="button" class="big-button" id="location-to-city">
          <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-town"/></svg></span>
          <span class="button-label">市や町から さがす</span>
        </button>
        <button type="button" class="big-button" id="location-to-name">
          <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-name"/></svg></span>
          <span class="button-label">お店の名前で さがす</span>
        </button>
      </div>

      <!-- お店のカードは、app.js が作ります -->
      <div class="store-list" id="location-result-list"></div>

      <!-- 距離についての注意書き -->
      <p id="location-note" class="location-note"></p>

      <div class="nav-buttons">
        <button type="button" class="big-button sub-button" id="back-to-top-from-location">
          <span class="button-icon" aria-hidden="true">⬅</span>
          <span class="button-label">最初の 画面に もどる</span>
        </button>
      </div>
    </section>

    <!-- ========== 画面：お店の名前でさがす ========== -->
    <section id="screen-name" hidden>
      <h2 class="section-title" id="name-title" tabindex="-1">お店の名前で さがす</h2>

      <!-- form で囲むと、キーボードの Enter でも「さがす」が動きます -->
      <form id="name-form" class="search-form">
        <label for="name-input" class="form-label">名前の 最初の 文字を 入れてください。<br>ひらがな・カタカナで さがせます。</label>
        <input type="text" id="name-input" class="text-input" autocomplete="off" enterkeyhint="search" autofocus>
        <!-- 入力した文字に合うお店の名前が、ここに出ます（app.js が作ります） -->
        <div id="name-suggestions" class="suggestions" hidden></div>
        <button type="submit" class="big-button" id="name-submit">
          <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-name"/></svg></span>
          <span class="button-label">さがす</span>
        </button>
      </form>

      <!-- 「見つかりました」「見つかりませんでした」などの知らせ -->
      <p id="name-message" class="search-message" role="status" aria-live="polite"></p>

      <!-- お店のカードは、app.js が作ります -->
      <div class="store-list" id="name-result-list"></div>

      <div class="nav-buttons">
        <button type="button" class="big-button sub-button" id="back-to-top-from-name">
          <span class="button-icon" aria-hidden="true">⬅</span>
          <span class="button-label">最初の 画面に もどる</span>
        </button>
      </div>
    </section>

    <!-- ========== 画面3：お店の一覧 ========== -->
    <section id="screen-list" hidden>
      <h2 class="section-title" id="list-title" tabindex="-1"></h2>

      <!-- お店のカードは、app.js が店舗データから作ります -->
      <div class="store-list" id="store-list"></div>

      <div class="nav-buttons">
        <button type="button" class="big-button sub-button" id="back-to-city">
          <span class="button-icon" aria-hidden="true">⬅</span>
          <span class="button-label">市や町を えらびなおす</span>
        </button>
        <button type="button" class="big-button sub-button" id="back-to-top-from-list">
          <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-town"/></svg></span>
          <span class="button-label">最初の 画面に もどる</span>
        </button>
      </div>
    </section>

  </main>

  <!-- 画面の下の部分 -->
  <footer class="site-footer">
    <p>対象地域：酒田市・三川町・庄内町・遊佐町</p>
  </footer>

  <!-- お店の名簿（先に読み込む） → 画面を動かすプログラム、の順番です -->
  <script src="data/stores.js?v=20261102a"></script>
  <script src="js/app.js?v=20261102a"></script>

</body>
</html>
