<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>かんたん お買い物ナビ</title>
  <link rel="stylesheet" href="css/style.css?v=20261021l">
</head>
<body class="is-top">

  <!-- ===== アイコン（自分で描いた図形。外部の画像は使いません） ===== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- 探し方のカードの、色つきのアイコン（自分で描いた図形） -->
      <symbol id="ic-here" viewBox="0 0 64 64">
        <path d="M4 22l16-6 20 6 20-6v36l-20 6-20-6-16 6z" fill="#8fd19e" stroke="#2f7d46" stroke-width="3" stroke-linejoin="round"/>
        <path d="M20 16v36M40 22v36" stroke="#2f7d46" stroke-width="2.5"/>
        <path d="M32 44c0 0-11-11-11-20a11 11 0 1 1 22 0c0 9-11 20-11 20z" fill="#e53935" stroke="#ffffff" stroke-width="2.5"/>
        <circle cx="32" cy="24" r="4.5" fill="#ffffff"/>
      </symbol>
      <symbol id="ic-town" viewBox="0 0 64 64">
        <rect x="6" y="30" width="22" height="26" fill="#fff3d6" stroke="#9a3412" stroke-width="3"/>
        <path d="M3 32L17 16l14 16z" fill="#e8590c" stroke="#9a3412" stroke-width="3" stroke-linejoin="round"/>
        <rect x="14" y="40" width="7" height="16" fill="#e8590c"/>
        <rect x="34" y="20" width="24" height="36" fill="#ffe2b0" stroke="#9a3412" stroke-width="3"/>
        <rect x="39" y="26" width="6" height="6" fill="#bfe3f5"/><rect x="49" y="26" width="6" height="6" fill="#bfe3f5"/>
        <rect x="39" y="37" width="6" height="6" fill="#bfe3f5"/><rect x="49" y="37" width="6" height="6" fill="#bfe3f5"/>
        <rect x="43" y="47" width="8" height="9" fill="#e8590c"/>
        <circle cx="56" cy="12" r="6" fill="#6cbf5c"/>
      </symbol>
      <symbol id="ic-name" viewBox="0 0 64 64">
        <rect x="8" y="26" width="34" height="28" fill="#fff8ee" stroke="#1d4ed8" stroke-width="3"/>
        <rect x="5" y="14" width="40" height="14" fill="#e8590c"/>
        <rect x="11" y="14" width="7" height="14" fill="#fff8ee"/><rect x="25" y="14" width="7" height="14" fill="#fff8ee"/><rect x="39" y="14" width="6" height="14" fill="#fff8ee"/>
        <rect x="20" y="36" width="10" height="18" fill="#bfe3f5" stroke="#1d4ed8" stroke-width="2"/>
        <circle cx="44" cy="40" r="12" fill="#ffffff" fill-opacity="0.7" stroke="#1d4ed8" stroke-width="5"/>
        <line x1="53" y1="49" x2="61" y2="58" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
      </symbol>
      <!-- 店のカードのボタンの、色つきのアイコン -->
      <symbol id="ic-flyer" viewBox="0 0 64 64">
        <rect x="8" y="6" width="42" height="52" rx="3" fill="#ffffff" stroke="#9a3412" stroke-width="3"/>
        <rect x="8" y="6" width="42" height="14" fill="#e53935"/>
        <rect x="14" y="26" width="30" height="4" fill="#e0c9a6"/>
        <circle cx="22" cy="43" r="8" fill="#6cbf5c" stroke="#2f7d46" stroke-width="2.5"/>
        <circle cx="39" cy="44" r="7" fill="#f6a021" stroke="#b45309" stroke-width="2.5"/>
        <path d="M44 20l14 6-4 32H44z" fill="#ffe2b0" stroke="#9a3412" stroke-width="3" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ic-shop-page" viewBox="0 0 64 64">
        <rect x="5" y="9" width="54" height="44" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
        <rect x="5" y="9" width="54" height="11" fill="#bfe3f5" stroke="#1d4ed8" stroke-width="3"/>
        <rect x="12" y="28" width="22" height="6" fill="#e8590c"/>
        <rect x="12" y="38" width="22" height="9" fill="#ffe2b0" stroke="#9a3412" stroke-width="2"/>
        <circle cx="46" cy="40" r="9" fill="#e8f6ff" stroke="#1d4ed8" stroke-width="2.5"/>
        <path d="M37 40h18M46 31c-5 5-5 13 0 18M46 31c5 5 5 13 0 18" fill="none" stroke="#1d4ed8" stroke-width="2"/>
      </symbol>
      <symbol id="ic-route" viewBox="0 0 64 64">
        <path d="M4 18l16-6 20 6 20-6v34l-20 6-20-6-16 6z" fill="#d9efd0" stroke="#2f7d46" stroke-width="3" stroke-linejoin="round"/>
        <path d="M10 44c10-2 8-14 18-14s8 8 16 4" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-dasharray="5 5" stroke-linecap="round"/>
        <path d="M48 28c0 0-8-8-8-14a8 8 0 1 1 16 0c0 6-8 14-8 14z" fill="#e53935" stroke="#ffffff" stroke-width="2"/>
        <circle cx="48" cy="14" r="3" fill="#ffffff"/>
        <rect x="10" y="44" width="22" height="9" rx="4" fill="#2f6fd0" stroke="#ffffff" stroke-width="2"/>
        <circle cx="16" cy="54" r="3.5" fill="#333"/><circle cx="27" cy="54" r="3.5" fill="#333"/>
      </symbol>
    </defs>
  </svg>

  <!-- 画面の上の部分（アプリの名前）。表紙のときは、画像の中に同じ文字があるので、見えなくする（読み上げ用には残す） -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="app-title"><span class="title-sub">かんたん</span><br>お買い物<br>ナビ</h1>
      <!-- どの画面からでも、すぐ表紙にもどれるボタン（表紙のときは、頭の部分ごと見えない） -->
      <button type="button" class="header-home-button" id="back-to-top-from-header">
        <span aria-hidden="true">⬅</span> 最初の 画面に もどる
      </button>
      <p class="app-lead">近くのお店を、<br>かんたんに さがせます。</p>
    </div>
  </header>

  <!-- 表紙の画像（表紙のときだけ出ます）。Canva で作った表紙で、タイトルと説明文が、画像の中に入っています -->
  <div class="hero">
    <img src="images/cover.jpg?v=20261021l" width="1024" height="796"
         alt="かんたん お買い物ナビ。近くのスーパーや、チラシを、かんたんに探せます。スーパーの前で、笑顔の家族が、買い物に来ています。">
  </div>

  <main class="top-main">

    <!-- ========== 画面1：表紙（さがし方をえらぶ） ========== -->
    <section id="screen-top">

    <h2 class="visually-hidden" id="top-title" tabindex="-1">どうやって さがしますか？</h2>

    <!-- 3つの探し方のボタン（表紙の絵の、カードの形） -->
    <div class="search-cards">
      <button type="button" class="search-card search-card-green" id="button-location">
        <span class="search-card-icon" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-here"/></svg></span>
        <span class="search-card-text">
          <span class="search-card-title">現在地から さがす</span>
        </span>
        <span class="search-card-arrow" aria-hidden="true">›</span>
      </button>

      <button type="button" class="search-card search-card-orange" id="button-city">
        <span class="search-card-icon" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-town"/></svg></span>
        <span class="search-card-text">
          <span class="search-card-title">市や町から さがす</span>
        </span>
        <span class="search-card-arrow" aria-hidden="true">›</span>
      </button>

      <button type="button" class="search-card search-card-blue" id="button-name">
        <span class="search-card-icon" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-name"/></svg></span>
        <span class="search-card-text">
          <span class="search-card-title">お店の 名前で さがす</span>
        </span>
        <span class="search-card-arrow" aria-hidden="true">›</span>
      </button>
    </div>

    </section>

    <!-- ========== 画面2：市や町をえらぶ ========== -->
    <!-- hidden がついている間は、画面に出ません -->
    <section id="screen-city" hidden>
      <h2 class="section-title" id="city-title" tabindex="-1">どの市・町ですか？</h2>

      <!-- 市や町のボタンは、app.js が店舗データから作ります -->
      <div class="search-buttons" id="city-buttons"></div>

      <div class="nav-buttons">
        <button type="button" class="big-button sub-button" id="back-to-top-from-city">
          <span class="button-icon" aria-hidden="true">⬅</span>
          <span class="button-label">最初の 画面に もどる</span>
        </button>
      </div>
    </section>

    <!-- ========== 画面：いまいる場所からさがす ========== -->
    <section id="screen-location" hidden>
      <h2 class="section-title" id="location-title" tabindex="-1">現在地から さがす</h2>

      <!-- 現在地を使う前に、目的を説明する -->
      <p class="location-explain">
        現在地を 使って 近いお店を さがします。<br>
        現在地は 保存も 送信も しません。
      </p>

      <button type="button" class="big-button" id="button-use-location">
        <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-here"/></svg></span>
        <span class="button-label">現在地から さがす</span>
      </button>

      <!-- 「しらべています…」「見つかりました」などの知らせ -->
      <p id="location-message" class="search-message" role="status" aria-live="polite"></p>

      <!-- うまくいかなかったときだけ出す、ほかのさがし方のボタン -->
      <div class="nav-buttons" id="location-other-way" hidden>
        <button type="button" class="big-button" id="location-to-city">
          <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-town"/></svg></span>
          <span class="button-label">市や町から さがす</span>
        </button>
        <button type="button" class="big-button" id="location-to-name">
          <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-name"/></svg></span>
          <span class="button-label">お店の名前で さがす</span>
        </button>
      </div>

      <!-- お店のカードは、app.js が作ります -->
      <div class="store-list" id="location-result-list"></div>

      <!-- 距離についての注意書き -->
      <p id="location-note" class="location-note"></p>

      <div class="nav-buttons">
        <button type="button" class="big-button sub-button" id="back-to-top-from-location">
          <span class="button-icon" aria-hidden="true">⬅</span>
          <span class="button-label">最初の 画面に もどる</span>
        </button>
      </div>
    </section>

    <!-- ========== 画面：お店の名前でさがす ========== -->
    <section id="screen-name" hidden>
      <h2 class="section-title" id="name-title" tabindex="-1">お店の名前で さがす</h2>

      <!-- form で囲むと、キーボードの Enter でも「さがす」が動きます -->
      <form id="name-form" class="search-form">
        <label for="name-input" class="form-label">名前の 最初の 文字を 入れてください。<br>ひらがな・カタカナで さがせます。</label>
        <input type="text" id="name-input" class="text-input" autocomplete="off" enterkeyhint="search" autofocus>
        <!-- 入力した文字に合うお店の名前が、ここに出ます（app.js が作ります） -->
        <div id="name-suggestions" class="suggestions" hidden></div>
        <button type="submit" class="big-button">
          <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-name"/></svg></span>
          <span class="button-label">さがす</span>
        </button>
      </form>

      <!-- 「見つかりました」「見つかりませんでした」などの知らせ -->
      <p id="name-message" class="search-message" role="status" aria-live="polite"></p>

      <!-- 見つからなかったときだけ出す、ほかのさがし方のボタン -->
      <div class="nav-buttons" id="name-other-way" hidden>
        <button type="button" class="big-button" id="name-to-city">
          <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-town"/></svg></span>
          <span class="button-label">市や町から さがす</span>
        </button>
      </div>

      <!-- お店のカードは、app.js が作ります -->
      <div class="store-list" id="name-result-list"></div>

      <div class="nav-buttons">
        <button type="button" class="big-button sub-button" id="back-to-top-from-name">
          <span class="button-icon" aria-hidden="true">⬅</span>
          <span class="button-label">最初の 画面に もどる</span>
        </button>
      </div>
    </section>

    <!-- ========== 画面3：お店の一覧 ========== -->
    <section id="screen-list" hidden>
      <h2 class="section-title" id="list-title" tabindex="-1"></h2>

      <!-- お店のカードは、app.js が店舗データから作ります -->
      <div class="store-list" id="store-list"></div>

      <div class="nav-buttons">
        <button type="button" class="big-button sub-button" id="back-to-city">
          <span class="button-icon" aria-hidden="true">⬅</span>
          <span class="button-label">市や町を えらびなおす</span>
        </button>
        <button type="button" class="big-button sub-button" id="back-to-top-from-list">
          <span class="button-icon icon-badge" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><use href="#ic-town"/></svg></span>
          <span class="button-label">最初の 画面に もどる</span>
        </button>
      </div>
    </section>

  </main>

  <!-- 画面の下の部分 -->
  <footer class="site-footer">
    <p>対象地域：酒田市・三川町・庄内町・遊佐町</p>
  </footer>

  <!-- お店の名簿（先に読み込む） → 画面を動かすプログラム、の順番です -->
  <script src="data/stores.js?v=20261021l"></script>
  <script src="js/app.js?v=20261021l"></script>

</body>
</html>
